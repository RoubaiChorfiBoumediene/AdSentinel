name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe
        run: for f in *.js; do node --check "$f"; done
      - name: Vérifier le manifeste
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Lancer les tests
        run: npm test
